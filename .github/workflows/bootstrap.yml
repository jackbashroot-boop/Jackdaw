name: bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOOTSTRAP_PAT }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure git
        run: |
          git config user.name  "jackbashroot-boop"
          git config user.email "jackbashroot-boop@users.noreply.github.com"

      - name: Run the bootstrap (commit only)
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_PAT }}
        run: bash bootstrap.sh --no-push

      - name: Make install.sh executable and push
        run: |
          git update-index --chmod=+x install.sh
          git commit -q -m "chore: make install.sh executable" || true
          git push origin HEAD:main

      - name: Summary
        run: |
          {
            echo "### Bootstrap complete"
            echo '```'
            git log --oneline | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
