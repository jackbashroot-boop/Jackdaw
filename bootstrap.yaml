          name: release

          on:
            push:
              tags: ["v*"]
            workflow_dispatch:
              inputs:
                version:
                  description: Version to release, without the leading v
                  required: true

          permissions:
            contents: write

          jobs:
            build:
              runs-on: ${{ '$' }}{{ matrix.os }}
              strategy:
                fail-fast: false
                matrix:
                  # macos-15 is arm64. osx-x64 cross-compiles from it, which works
                  # because this is self-contained, not Native AOT. macos-14 was
                  # retired on 2026-11-02.
                  include:
                    - { rid: win-x64,     os: windows-latest }
                    - { rid: win-arm64,   os: windows-latest }
                    - { rid: linux-x64,   os: ubuntu-latest }
                    - { rid: linux-arm64, os: ubuntu-latest }
                    - { rid: osx-arm64,   os: macos-15 }
                    - { rid: osx-x64,     os: macos-15 }

              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    fetch-depth: 0

                - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                  with:
                    dotnet-version: 9.0.x

                - name: Publish
                  shell: bash
                  run: |
                    dotnet publish src/Jackdaw.Cli \
                      -c Release \
                      -r ${{ '$' }}{{ matrix.rid }} \
                      --self-contained true \
                      -p:PublishSingleFile=true \
                      -p:IncludeNativeLibrariesForSelfExtract=true \
                      -p:EnableCompressionInSingleFile=true \
                      -o out/${{ '$' }}{{ matrix.rid }}

                - name: Package
                  shell: bash
                  run: |
                    cd out/${{ '$' }}{{ matrix.rid }}
                    rm -f ./*.pdb
                    tar -czf "../jackdaw-${{ '$' }}{{ matrix.rid }}.tar.gz" .
                    cd ..
                    if command -v sha256sum >/dev/null 2>&1; then
                      sha256sum "jackdaw-${{ '$' }}{{ matrix.rid }}.tar.gz" > "jackdaw-${{ '$' }}{{ matrix.rid }}.tar.gz.sha256"
                    else
                      shasum -a 256 "jackdaw-${{ '$' }}{{ matrix.rid }}.tar.gz" > "jackdaw-${{ '$' }}{{ matrix.rid }}.tar.gz.sha256"
                    fi
                    cat "jackdaw-${{ '$' }}{{ matrix.rid }}.tar.gz.sha256"

                - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                  with:
                    name: jackdaw-${{ '$' }}{{ matrix.rid }}
                    path: out/jackdaw-${{ '$' }}{{ matrix.rid }}.tar.gz*

            release:
              needs: build
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    fetch-depth: 0

                - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                  with:
                    dotnet-version: 9.0.x

                - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
                  with:
                    path: dist
                    merge-multiple: true

                - name: Work out the version
                  id: v
                  run: |
                    if [ -n "${{ '$' }}{{ inputs.version }}" ]; then
                      echo "version=${{ '$' }}{{ inputs.version }}" >> "$GITHUB_OUTPUT"
                    else
                      echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
                    fi

                - name: Regenerate the changelog for this release
                  run: |
                    dotnet run --project tools/Jackdaw.ChangelogGen -c Release -- --promote "${{ '$' }}{{ steps.v.outputs.version }}"

                - name: Extract release notes from the changelog
                  run: |
                    awk -v ver="v${{ '$' }}{{ steps.v.outputs.version }}" '
                      $0 ~ "^## " ver " " { found=1; next }
                      found && /^## / { exit }
                      found { print }
                    ' CHANGELOG.md > notes.md
                    test -s notes.md || echo "See CHANGELOG.md" > notes.md

                # Without this the released section only exists inside the release notes,
                # and the next generator run on main silently drops it.
                - name: Commit the released changelog back to main
                  run: |
                    git config user.name  "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add changelog.json CHANGELOG.md
                    if git diff --cached --quiet; then
                      echo "nothing to commit"
                      exit 0
                    fi
                    git commit -m "chore: changelog for v${{ '$' }}{{ steps.v.outputs.version }}"
                    git push origin "HEAD:main" \
                      || echo "::warning::could not push the changelog to main"

                - name: Publish the release
                  env:
                    GH_TOKEN: ${{ '$' }}{{ secrets.GITHUB_TOKEN }}
                  run: |
                    gh release create "v${{ '$' }}{{ steps.v.outputs.version }}" \
                      --title "Jackdaw v${{ '$' }}{{ steps.v.outputs.version }}" \
                      --notes-file notes.md \
                      dist/jackdaw-*.tar.gz dist/jackdaw-*.tar.gz.sha256
          JACKDAW_EOF

          commit "feat: release pipeline building six platforms" \
                 "Builds self-contained binaries, publishes checksums, and pulls release notes from the changelog."

          # ------------------------------------------------------------ verify ---

          if [ "$RUN_GEN" = 1 ] && command -v dotnet >/dev/null 2>&1; then
            echo
            echo "Generating the changelog from the commits just made"
            dotnet run --project tools/Jackdaw.ChangelogGen -c Release -- --quiet
            commit "chore: regenerate changelog from the initial commits" \
                   "chore keeps this out of its own output so regenerating stays idempotent."
          fi

          if [ "$VERIFY" = 1 ]; then
            echo
            echo "Verifying before anything is pushed"
            failed=0

            for f in bootstrap.sh install.sh; do
              if [ -f "$f" ]; then
                if bash -n "$f" 2>/dev/null; then printf '  ok       syntax  %s\n' "$f"; else bad "syntax $f"; failed=1; fi
              fi
            done

            if [ -f changelog.json ]; then
              if command -v jq >/dev/null 2>&1; then
                if jq -e . changelog.json >/dev/null 2>&1; then printf '  ok       json    changelog.json\n'; else bad "json changelog.json"; failed=1; fi
              elif command -v python3 >/dev/null 2>&1; then
                if python3 -c 'import json,sys; json.load(open(sys.argv[1]))' changelog.json 2>/dev/null; then printf '  ok       json    changelog.json\n'; else bad "json changelog.json"; failed=1; fi
              fi
            fi

            while IFS= read -r f; do
              if [ ! -s "$f" ]; then bad "empty file: $f"; failed=1; fi
            done < <(git ls-files --cached --others --exclude-standard)

            if command -v dotnet >/dev/null 2>&1 && [ -f Jackdaw.slnx ]; then
              if dotnet build Jackdaw.slnx -c Release --nologo -v q >/dev/null 2>&1; then
                printf '  ok       build   Jackdaw.slnx\n'
                if dotnet run --project src/Jackdaw.Cli -c Release -- version >/dev/null 2>&1; then
                  printf '  ok       smoke   jackdaw version\n'
                else
                  bad "smoke jackdaw version"; failed=1
                fi
              else
                bad "build Jackdaw.slnx"; failed=1
              fi
            else
              printf '  skip     build   (no dotnet on PATH)\n'
            fi

            if command -v dotnet >/dev/null 2>&1 && [ -f changelog.json ]; then
              before="$(git hash-object changelog.json CHANGELOG.md)"
              dotnet run --project tools/Jackdaw.ChangelogGen -c Release -- --quiet >/dev/null 2>&1
              after="$(git hash-object changelog.json CHANGELOG.md)"
              if [ "$before" = "$after" ]; then
                printf '  ok       idem    changelog is stable across two runs\n'
              else
                bad "changelog is not idempotent"; failed=1
              fi
            fi

            if [ "$failed" -ne 0 ]; then
              echo
              echo "Verification failed. Nothing was pushed." >&2
              exit 1
            fi
          fi

          # ---------------------------------------------------------- integrity ---

          if [ "$DRY_RUN" = 0 ]; then
            if command -v sha256sum >/dev/null 2>&1 || command -v shasum >/dev/null 2>&1; then
              git ls-files | grep -v '^MANIFEST\.sha256$' | sort > .manifest.list
              hash_files $(cat .manifest.list) > MANIFEST.sha256
              rm -f .manifest.list
              commit "chore: checksum manifest" \
                     "sha256 of every tracked file, so a fresh clone can be verified."
            fi
          fi

          # --------------------------------------------------------------- push ---

          if [ "$DRY_RUN" = 1 ]; then
            echo
            echo "Dry run. Nothing committed or pushed."
            git status --short
          fi

          if [ "$DO_PUSH" = 1 ] && [ "$DRY_RUN" = 0 ]; then
            echo
            echo "Pushing to origin"
            if ! git push -u origin "$branch"; then
              {
                echo
                echo "Push failed. The three usual causes:"
                echo "  - the workflow is missing 'permissions: contents: write'"
                echo "  - branch protection on '$branch' requires a pull request"
                echo "  - the token in use cannot push to $REPO"
              } >&2
              exit 1
            fi

            # Publish the recovery ref too, so undo works from any clone.
            git push origin "refs/heads/$BACKUP_REF:refs/heads/$BACKUP_REF" 2>/dev/null \
              || note "could not publish $BACKUP_REF (harmless)"
          fi

          # ---------------------------------------------------------------- tag ---

          if [ -n "$TAG" ] && [ "$DRY_RUN" = 0 ]; then
            if command -v dotnet >/dev/null 2>&1; then
              if dotnet run --project src/Jackdaw.Cli -c Release -- doctor >/dev/null 2>&1; then
                note "doctor is clean"
              else
                echo "doctor failed; skipping the tag" >&2
                TAG=""
              fi
            fi
          fi

          if [ -n "$TAG" ] && [ "$DRY_RUN" = 0 ]; then
            echo
            echo "Tagging $TAG"
            git tag -a "$TAG" -m "Jackdaw $TAG"
            if [ "$DO_PUSH" = 1 ]; then git push origin "$TAG"; fi

            # A GITHUB_TOKEN tag push fires no workflow either, so dispatch the
            # release by hand. Retry while GitHub registers the new file.
            if [ "$HAVE_GH" = 1 ] && [ -n "${GITHUB_ACTIONS:-}" ] && [ "$DO_PUSH" = 1 ]; then
              attempt=1
              while [ "$attempt" -le 5 ]; do
                if gh workflow run release.yml --ref "$branch" -f "version=${TAG#v}" 2>/dev/null; then break; fi
                note "release.yml not registered yet, retrying ($attempt/5)"
                sleep 3
                attempt=$((attempt + 1))
              done
            fi
          fi

          # ----------------------------------------------------------------- gh ---

          if [ "$HAVE_GH" = 1 ]; then
            echo
            echo "Updating repository metadata"
            gh repo edit "$REPO" --description "$DESCRIPTION" --add-topic "$TOPICS" || true

            if [ -n "${GITHUB_ACTIONS:-}" ] && [ "$DO_PUSH" = 1 ]; then
              echo "Kicking off the ci workflow"
              attempt=1
              while [ "$attempt" -le 5 ]; do
                if gh workflow run ci.yml --ref "$branch" 2>/dev/null; then break; fi
                note "ci.yml not registered yet, retrying ($attempt/5)"
                sleep 3
                attempt=$((attempt + 1))
              done
            fi
          fi

          echo
          echo "Done."
          echo
          echo "Next:"
          echo "  dotnet run --project src/Jackdaw.Cli -- doctor"
          echo "  dotnet run --project src/Jackdaw.Cli -- changelog"
          echo
          echo "Undo at any point with:"
          echo "  bash bootstrap.sh --undo"
          BOOTSTRAP_EOF

      - name: Finalise bootstrap.sh
        run: |
          chmod +x bootstrap.sh
          bash -n bootstrap.sh
          echo "bootstrap.sh: $(wc -c < bootstrap.sh) bytes, $(wc -l < bootstrap.sh) lines"
          git add bootstrap.sh
          if ! git diff --cached --quiet; then
            git commit -q -m "chore: refresh bootstrap script"
          fi

      - name: Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTNET_NOLOGO: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          ARGS=""
          if [ "${{ inputs.mode }}" = "undo" ]; then ARGS="$ARGS --undo"; fi
          if [ "${{ inputs.skip_existing }}" = "true" ]; then ARGS="$ARGS --skip-existing"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.no_push }}" = "true" ]; then ARGS="$ARGS --no-push"; fi
          if [ -n "${{ inputs.tag }}" ]; then ARGS="$ARGS --tag ${{ inputs.tag }}"; fi
          echo "> bash bootstrap.sh$ARGS"
          bash bootstrap.sh $ARGS

      - name: Post-run re-check
        if: always() && inputs.mode == 'bootstrap' && inputs.dry_run == false
        run: |
          echo "--- working tree ---"
          git status --porcelain
          echo "--- head ---"
          git rev-parse --short HEAD
          echo "--- log ---"
          git log --oneline -10
          echo "--- rebuild from the committed state ---"
          dotnet build Jackdaw.slnx -c Release --nologo

      - name: Summary
        if: always()
        run: |
          {
            echo "### bootstrap: ${{ inputs.mode }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| branch | \`${GITHUB_REF_NAME}\` |"
            echo "| head | \`$(git rev-parse --short HEAD)\` |"
            echo "| tracked files | $(git ls-files | wc -l) |"
            echo "| recovery ref | \`pre-bootstrap\` |"
            echo
            echo '```'
            git log --oneline -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
