name: bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bootstrap writes the tree; undo resets to the pre-bootstrap ref"
        type: choice
        options: [bootstrap, undo]
        default: bootstrap
      skip_existing:
        description: "Leave files that already exist alone"
        type: boolean
        default: false
      dry_run:
        description: "Write and verify, then stop. No commits, no push."
        type: boolean
        default: false
      no_push:
        description: "Commit locally only"
        type: boolean
        default: false
      tag:
        description: "Tag the result, e.g. v0.1.0. Blank for none."
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Configure git
        run: |
          git config user.name  "jackbashroot-boop"
          git config user.email "jackbashroot-boop@users.noreply.github.com"

      # GitHub parses any run: block CONTAINING ${{ }} as ONE expression, capped at
      # 21000 chars. The assembled script is ~58k, so it is written in ten appends.
      # Only step 9 carries ${{. Do not merge these back together.
      - name: Seed 1/10
        run: |
          cat > bootstrap.sh <<'BOOTSTRAP_EOF'
          #!/usr/bin/env bash
          #
          # Jackdaw bootstrap - writes the Phase 0 tree, verifies it, commits, pushes.
          #
          #   bash bootstrap.sh
          #
          # Modes:
          #   (default)         write, verify, commit, push
          #   --undo            reset to the 'pre-bootstrap' ref and force-push
          #
          # Options:
          #   --dry-run         write and verify, then stop
          #   --no-verify       skip the syntax and build gate that runs before pushing
          #   --no-push         commit locally only
          #   --no-changelog    skip the changelog generator
          #   --skip-existing   leave files that already exist alone
          #   --tag <version>   tag the result, e.g. --tag v0.1.0, and push the tag
          #   --force           proceed even with a dirty working tree
          #   -h, --help        this text
          #
          set -euo pipefail

          export GIT_TERMINAL_PROMPT=0
          export DOTNET_NOLOGO="${DOTNET_NOLOGO:-1}"
          export DOTNET_CLI_TELEMETRY_OPTOUT="${DOTNET_CLI_TELEMETRY_OPTOUT:-1}"

          REPO="jackbashroot-boop/Jackdaw"
          DESCRIPTION="A local-first personal AI that spawns sub-agents, watches your PC and LAN, and stays out of the way while you game."
          TOPICS="ai-agents,blue-team,security,dotnet,local-first,home-lab,monitoring,llm"
          BACKUP_REF="pre-bootstrap"

          SKIP_EXISTING=0
          DO_PUSH=1
          RUN_GEN=1
          DRY_RUN=0
          VERIFY=1
          FORCE=0
          UNDO=0
          TAG=""

          while [ $# -gt 0 ]; do
            case "$1" in
              --dry-run)       DRY_RUN=1; DO_PUSH=0 ;;
              --no-verify)     VERIFY=0 ;;
              --no-push)       DO_PUSH=0 ;;
              --no-changelog)  RUN_GEN=0 ;;
              --skip-existing) SKIP_EXISTING=1 ;;
              --force)         FORCE=1 ;;
              --undo)          UNDO=1 ;;
              --tag)           [ $# -ge 2 ] || { echo "--tag needs a value" >&2; exit 2; }; TAG="$2"; shift ;;
              -h|--help)
                awk 'NR == 1 { next } /^#/ { sub(/^# ?/, ""); print; next } { exit }' "$0"
                exit 0 ;;
              *) echo "unknown option: $1" >&2; exit 2 ;;
            esac
            shift
          done

          say()  { printf '%s\n' "$*"; }
          note() { printf '  %s\n' "$*"; }
          bad()  { printf 'FAIL  %s\n' "$*" >&2; }

          if [ ! -d .git ]; then
            echo "Not inside a git repository. Clone it first:" >&2
            echo "  git clone https://github.com/$REPO.git && cd Jackdaw" >&2
            exit 1
          fi

          git config --global --add safe.directory "$PWD" 2>/dev/null || true

          detected="$(git remote get-url origin 2>/dev/null | sed -E 's#^.*github\.com[:/]##; s#\.git$##' || true)"
          if [ -n "$detected" ]; then REPO="$detected"; fi

          case "$REPO" in
            */*) ;;
            *) echo "warning: could not read owner/repo from origin; using $REPO" >&2 ;;
          esac

          git rev-parse --verify HEAD >/dev/null 2>&1 || git checkout -b main 2>/dev/null || true

          branch="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)"
          if [ -z "$branch" ] || [ "$branch" = "HEAD" ]; then
            branch="${GITHUB_REF_NAME:-main}"
          fi

          HAVE_GH=0
          if command -v gh >/dev/null 2>&1 && gh auth status >/dev/null 2>&1; then HAVE_GH=1; fi

          if [ -z "$(git config user.email || true)" ]; then
            git config user.email "jackbashroot-boop@users.noreply.github.com"
            git config user.name  "jackbashroot-boop"
            note "set a local git identity so commits are attributed"
          fi

          say "repo    $REPO"
          say "branch  $branch"
          if [ "$HAVE_GH" = 1 ]; then
            if gh api "repos/$REPO/branches/$branch/protection" >/dev/null 2>&1; then
              note "branch protection is on; a direct push may be rejected"
            fi
          fi

          if [ "$UNDO" = 1 ]; then
            base="$(git rev-parse -q --verify "refs/heads/$BACKUP_REF" 2>/dev/null || true)"
            if [ -z "$base" ]; then
              echo "no local '$BACKUP_REF' ref. Try: git fetch origin $BACKUP_REF" >&2
              exit 1
            fi
            say "Resetting $branch to $BACKUP_REF ($(git rev-parse --short "$base"))"
            git reset --hard "$base"
            if [ "$DO_PUSH" = 1 ]; then
              git push --force-with-lease origin "HEAD:$branch"
            fi
            say "Undone. Nothing deleted; the old commits are still in the reflog."
            exit 0
          fi

          if [ "$FORCE" = 0 ] && [ -n "$(git status --porcelain)" ]; then
            echo "error: the working tree has uncommitted changes." >&2
            echo "       commit or stash them, or pass --force." >&2
            git status --short >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/heads/$BACKUP_REF" >/dev/null 2>&1 \
             && ! git rev-parse -q --verify "refs/remotes/origin/$BACKUP_REF" >/dev/null 2>&1; then
            git branch "$BACKUP_REF" HEAD
            note "created the $BACKUP_REF recovery ref"
          fi

          write() {
            local path="$1"
            if [ -e "$path" ] && [ "$SKIP_EXISTING" = 1 ]; then
              cat > /dev/null
              printf '  kept     %s\n' "$path"
              return
            fi
            mkdir -p "$(dirname "$path")"
            cat > "$path"
            printf '  wrote    %s\n' "$path"
          }

          commit() {
            git add -A
            if git diff --cached --quiet; then return; fi
            git commit -q -m "$1" -m "${2:-}"
            printf '  commit   %s\n' "$1"
          }

          hash_files() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi
          }

          echo
          echo "Writing files"
          echo
          BOOTSTRAP_EOF

